<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiva Shakti Mandir — 2026 Sponsorship Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shiva Shakti Mandir</h1>
    <p class="subtitle">2026 Sponsorship Schedule</p>
  </header>

  <main>
    <div id="loading" class="loading">Loading schedule…</div>
    <div id="error-banner" class="error-banner" hidden></div>

    <table id="schedule" hidden>
      <thead>
        <tr>
          <th>Date</th>
          <th>Event</th>
          <th>Sponsor</th>
        </tr>
      </thead>
      <tbody id="schedule-body">
        <!-- Rows injected by signup.js -->
      </tbody>
    </table>
  </main>

  <script src="signup.js"></script>
</body>
</html>
